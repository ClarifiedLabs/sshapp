name: test-ios

on:
  push:
    branches:
      - main
      - release-ci
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: iOS tests
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      SCHEME: SSHApp
      IOS_SIMULATOR_RUNTIME_MAJOR: "27"
      PROJECT: SSHApp.xcodeproj
      XCODE_SOURCE_PACKAGES_PATH: .build/ci/xcode-source-packages
      XCODE_DERIVED_DATA_PATH: .build/ci/xcode-derived-data
      XCODE_RESULT_BUNDLE_PATH: .build/ci/xcresults
      TEST_SIMULATOR_NAME: SSHApp CI Tests
      ALL_TEST_PLAN: SSHAppAllTests
      UNIT_TEST_PLAN: SSHAppUnitTests
      UNIT_SIMULATOR_NAME: SSHApp CI Unit Tests
      UNIT_TEST_ATTEMPTS: 2
      UI_TEST_PLAN: SSHAppUITests
      UI_SIMULATOR_NAME: SSHApp CI UI Tests
      UI_TEST_ATTEMPTS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Not actions/checkout submodule checkout: with fetch-depth 0 it clones
      # Ghostty's full history. `make submodules` fetches only the pinned Ghostty
      # commit (depth 1) plus our direct openssl/libssh2 pins; not recursive, so
      # OpenSSL's test/fuzz/interop submodules (unused with no-tests) aren't fetched.
      - name: Check out pinned submodules
        run: make submodules

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          developer_dir="$(./scripts/resolve-xcode.sh 27)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version

      - name: Resolve native cache inputs
        id: native-cache
        run: |
          set -euo pipefail
          echo "libssh2_commit=$(git -C vendor/libssh2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "openssl_commit=$(git -C vendor/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          toolchain="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-build-version; xcrun --sdk iphonesimulator --show-sdk-build-version; } | shasum -a 256 | cut -c1-16)"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Cache native frameworks
        id: native-framework-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            Frameworks/libssh2.xcframework
            Frameworks/libcrypto.xcframework
            Frameworks/libssl.xcframework
            Frameworks/GhosttyVT.xcframework
          key: native-frameworks-${{ runner.os }}-xcode27-${{ steps.native-cache.outputs.toolchain }}-${{ steps.native-cache.outputs.libssh2_commit }}-${{ steps.native-cache.outputs.openssl_commit }}-${{ hashFiles('scripts/build-libssh2.sh', 'scripts/libssh2-patches/**', 'scripts/build-ghostty-vt.sh', 'scripts/build-ghostty-vt-native.py', 'vendor/libghostty-vt/native-lock.json', 'vendor/libghostty-vt/patches/**', 'Packages/SSHAppGhostty/Package.swift') }}

      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos metal --version

      - name: Build native frameworks
        run: |
          set -euo pipefail
          make setup

      - name: Test patched libssh2 authentication callbacks
        run: |
          set -euo pipefail
          make libssh2-host-test

      - name: Cache Xcode SwiftPM packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.XCODE_SOURCE_PACKAGES_PATH }}
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('SSHApp.xcodeproj/project.pbxproj', 'Packages/SSHAppGhostty/Package.swift') }}
          restore-keys: |
            xcode-spm-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.XCODE_DERIVED_DATA_PATH }}
          key: xcode-deriveddata-test-${{ runner.os }}-xcode27-${{ hashFiles('SSHApp.xcodeproj/project.pbxproj', 'SSHApp.xcodeproj/xcshareddata/xcschemes/*.xcscheme', 'TestPlans/*.xctestplan', 'SSHApp/**/*.swift', 'SSHApp/**/*.h', 'SSHApp/**/*.c', 'SSHApp/**/*.entitlements', 'Packages/SSHAppGhostty/Package.swift', 'Packages/SSHAppGhostty/Sources/**/*.swift', 'Packages/SSHAppGhostty/Sources/**/*.h', 'Packages/SSHAppGhostty/Sources/**/*.c', 'scripts/build-libssh2.sh', 'scripts/build-ghostty-vt.sh', 'scripts/build-ghostty-vt-native.py', 'vendor/libghostty-vt/native-lock.json', 'vendor/libghostty-vt/patches/**') }}
          restore-keys: |
            xcode-deriveddata-test-${{ runner.os }}-xcode27-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          mkdir -p "$XCODE_SOURCE_PACKAGES_PATH" "$XCODE_DERIVED_DATA_PATH"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$PWD/$XCODE_SOURCE_PACKAGES_PATH" \
            -derivedDataPath "$PWD/$XCODE_DERIVED_DATA_PATH" \
            -skipPackagePluginValidation

      - name: Run iOS tests
        run: |
          set -euo pipefail
          ./scripts/run-ios-tests.sh all

      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SSHApp.xcresults
          path: ${{ env.XCODE_RESULT_BUNDLE_PATH }}
          if-no-files-found: warn
